name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install fitdecode
      - name: Repo checks (manifests, Agent Skills rules, data integrity, privacy scan)
        run: python tests/check_repo.py
      - name: Offline tests (no Garmin account)
        run: python tests/test_offline.py
